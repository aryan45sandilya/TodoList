<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly To-Do Checklist</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Monthly To-Do Checklist</h1>
            <div class="month-selector">
                <button class="month-btn" id="prevMonth">◀</button>
                <div class="current-month" id="currentMonth">October 2025</div>
                <button class="month-btn" id="nextMonth">▶</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingTasks">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>

        <div class="add-task-section">
            <div class="task-input-group">
                <input 
                    type="text" 
                    class="task-input" 
                    id="taskInput" 
                    placeholder="Add a new task..."
                >
                <button class="add-btn" id="addTaskBtn">➕ Add Task</button>
            </div>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul class="tasks-list" id="tasksList">
            <div class="empty-state">
                <div class="empty-state-icon">📋</div>
                <p>No tasks yet. Add your first task to get started!</p>
            </div>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
